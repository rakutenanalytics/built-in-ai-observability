# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Routine bumps arrive as one PR; majors stay separate so a breaking
    # change is never buried in a batch.
    groups:
      # The @opentelemetry/* packages pin each other tightly (exporter 0.301 depends
      # on sdk-trace 3.1.0, which pins core/resources 3.1.0 and an api range), so
      # they must move together or not at all.
      opentelemetry:
        patterns: [ "@opentelemetry/*" ]
      npm:
        patterns: [ "*" ]
        exclude-patterns: [ "@opentelemetry/*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
