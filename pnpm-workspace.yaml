  "@opentelemetry/resources": ^2.11.0
  "@opentelemetry/sdk-trace-base": ^2.11.0
  "@opentelemetry/sdk-trace-web": ^2.11.0
  "@types/chrome": ^0.3.0
  "@types/node": ^22.20.3
  fake-indexeddb: ^6.2.5
  lefthook: ^2.1.14
  tsdown: ^0.23.0
  turbo: ^2.11.4
  typescript: ^7.0.2
  ultracite: ^7.12.0
  vite: ^8.3.0
  vitest: ^5.0.1
