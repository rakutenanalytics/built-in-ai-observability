  "@opentelemetry/exporter-trace-otlp-http": ^0.300.0
  "@opentelemetry/resources": ^2.12.0
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@opentelemetry/sdk-trace-web": ^2.12.0
  "@types/chrome": ^0.3.7
  "@types/node": ^26.6.6
  fake-indexeddb: ^6.2.7
  lefthook: ^2.2.2
  tsdown: ^0.23.4
  turbo: ^2.11.10
  typescript: ^7.0.2
  ultracite: ^7.12.0
  vite: ^8.3.5
  vitest: ^5.1.0
