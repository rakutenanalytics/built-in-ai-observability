  "@opentelemetry/resources": ^2.12.0
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@opentelemetry/sdk-trace-web": ^2.12.0
  "@types/chrome": ^0.3.5
  "@types/node": ^26.6.5
  fake-indexeddb: ^6.2.5
  lefthook: ^2.2.1
  tsdown: ^0.23.1
  turbo: ^2.11.7
  typescript: ^7.0.2
  ultracite: ^8.0.1
  vite: ^8.3.4
  vitest: ^5.0.4
