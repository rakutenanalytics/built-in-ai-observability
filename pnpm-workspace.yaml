packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

# Early-stage repo: allow freshly published packages without supply-chain age gate.
minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  lefthook: true

catalog:
