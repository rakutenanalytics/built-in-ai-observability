packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

# Early-stage repo: allow freshly published packages without supply-chain age gate.
minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  lefthook: true

catalog:
  "@biomejs/biome": ^2.6.3
  "@opentelemetry/api": ^1.10.0
  "@opentelemetry/core": ^2.12.0
  "@opentelemetry/exporter-trace-otlp-http": ^0.300.0
  "@opentelemetry/resources": ^2.12.0
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@opentelemetry/sdk-trace-web": ^2.12.0
  "@types/chrome": ^0.3.6
  "@types/node": ^26.6.5
  fake-indexeddb: ^6.2.6
  lefthook: ^2.2.2
  tsdown: ^0.23.2
  turbo: ^2.11.10
  typescript: ^7.0.2
  ultracite: ^7.12.0
  vite: ^8.3.5
  vitest: ^5.0.5
